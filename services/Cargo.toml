[workspace]
resolver = "3"
members = ["crates/*", "lambdas/*", "tools/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/sw-works/mantelpiece"
rust-version = "1.93"

[workspace.dependencies]
mantelpiece-core = { path = "crates/core" }
mantelpiece-ingest = { path = "crates/ingest" }
mantelpiece-trips = { path = "crates/trips" }
mantelpiece-store = { path = "crates/store" }
mantelpiece-poster = { path = "lambdas/poster" }
mantelpiece-fieldnotes = { path = "crates/fieldnotes" }
mantelpiece-reels = { path = "crates/reels" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
time = { version = "0.3", features = ["serde", "formatting", "parsing", "macros"] }
uuid = { version = "1", features = ["v4", "serde"] }
rand = "0.9"
sha2 = "0.10"
hex = "0.4"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
kamadak-exif = "0.6"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
async-trait = "0.1"
tracing = "0.1"
lambda_http = "1"
lambda_runtime = "1"
aws-config = { version = "1", features = ["behavior-version-latest"] }
aws-sdk-dynamodb = "1"
aws-sdk-s3 = "1"
aws-sdk-eventbridge = "1"
aws-sdk-sfn = "1"
aws-sdk-rekognition = "1"
aws-sdk-bedrockruntime = "1"
aws-sdk-s3vectors = "1"
aws-sdk-geomaps = "1"
aws-sdk-polly = "1"
aws-sdk-sesv2 = "1"
aws-sdk-geoplaces = "1"
aws-sdk-ivs = "1"
aws-sdk-lambda = "1"
aws-sdk-scheduler = "1"
web-push-native = "0.5"
ureq = { version = "3", features = ["json"] }
aws-smithy-types = "1"
serde_dynamo = { version = "4", features = ["aws-sdk-dynamodb+1"] }
hmac = "0.12"
base64 = "0.22"
http = "1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
doc_markdown = "allow"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

# Drawing maps pixel by pixel is slow unoptimised; tests that draw them stay quick.
[profile.dev.package.mantelpiece-fieldnotes]
opt-level = 2
[profile.dev.package.tiny-skia]
opt-level = 2
