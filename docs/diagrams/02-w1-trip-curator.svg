<text x="1007" y="125.8" text-anchor="middle" font-size="12.0" font-weight="600" fill="#24292f">check_narrative</text>
<text x="1007" y="139.8" text-anchor="middle" font-size="8.5" fill="#57606a" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">years · months · capitalised names</text>
