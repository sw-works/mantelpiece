<text x="318.4" y="475" font-size="11" fill="#57606a">human decision</text>
<rect x="436" y="465" width="18" height="12" rx="3" fill="#fff0f0" stroke="#cf222e" />
<text x="460" y="475" font-size="11" fill="#57606a">security service</text>
<rect x="590.4" y="465" width="18" height="12" rx="3" fill="#f3f4f6" stroke="#8c959f" stroke-dasharray="2 3"/>
