<rect x="912" y="100" width="190" height="64" rx="6" fill="#fff0f0" stroke="#cf222e" stroke-width="1.5" />
<text x="1007" y="124.0" text-anchor="middle" font-size="12.0" font-weight="600" fill="#24292f">Gateway Policy</text>
<text x="1007" y="138.0" text-anchor="middle" font-size="10.0" fill="#57606a" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">Cedar: share_album</text>
