<text x="24" y="34" font-size="20" font-weight="600" fill="#24292f">W5 · Share — "send Kyoto highlights to grandma" is W2 plus a confirmation</text>
<text x="24" y="54" font-size="12" fill="#57606a">The request becomes a playlist by the Ask path; sharing it outside the household is irreversible, so it takes the same token gate as deletion.</text>
