<rect x="738.4" y="465" width="18" height="12" rx="3" fill="#fff0f0" stroke="#cf222e" />
<text x="762.4" y="475" font-size="11" fill="#57606a">blocked / failed</text>
<rect x="892.8" y="465" width="18" height="12" rx="3" fill="#e6f4ea" stroke="#1a7f37" />
<text x="916.8" y="475" font-size="11" fill="#57606a">terminal / outcome</text>
<text x="1336" y="450" text-anchor="end" font-size="10.5" fill="#57606a">Why the same gate as delete: a link that leaves the household cannot be recalled once opened; the token proves a person on the couch said yes to this album.</text>
