<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1360 500" width="1360" height="500" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" role="img" aria-label="W4 · Dedup Steward — the agent proposes, the remote decides, the policy enforces">
