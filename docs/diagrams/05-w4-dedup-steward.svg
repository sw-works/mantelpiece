<text x="948.8000000000001" y="475" font-size="11" fill="#57606a">terminal / outcome</text>
<text x="1336" y="450" text-anchor="end" font-size="10.5" fill="#57606a">Why a token and not a flag: an agent can set confirm=true; it cannot produce a value the TV signed five minutes ago for exactly these group ids (F-504).</text>
