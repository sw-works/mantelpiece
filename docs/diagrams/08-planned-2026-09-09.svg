<text x="1436" y="822" text-anchor="end" font-size="10.5" fill="#57606a">Everything drawn here is code-complete with in-memory tests on 2026-09-09; device behaviour, the deployed stack and the Alexa+ registration are not verified.</text>
<text x="1436" y="836" text-anchor="end" font-size="10.5" fill="#57606a">The audit log (AU#) records sign-in, shares, deletions, memberships and every gated tool route with the confirmation it carried (F-605, SC-006).</text>
<text x="1436" y="850" text-anchor="end" font-size="10.5" fill="#57606a">Narration audio depends on a system-deployed media port on Vega; without it the slideshow shows the story as captions and the flag stays off.</text>
