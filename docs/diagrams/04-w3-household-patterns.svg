<text x="24" y="34" font-size="20" font-weight="600" fill="#24292f">W3 · Household Patterns — the ambient set learns from pin and hide, with no model in the loop</text>
<text x="24" y="54" font-size="12" fill="#57606a">Nightly. Feedback becomes tag weights in AgentCore Memory; the favourite tag drives search; the rationale is stored next to the playlist.</text>
