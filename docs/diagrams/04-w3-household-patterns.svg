<text x="498.4" y="495" font-size="11" fill="#57606a">terminal / outcome</text>
<text x="1336" y="470" text-anchor="end" font-size="10.5" fill="#57606a">Why no model: the judgement here is a running tally; a model would add cost and a reason to distrust the result. Memory carries the state between nights.</text>
