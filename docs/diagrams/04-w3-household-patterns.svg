<text x="1225" y="130.0" text-anchor="middle" font-size="12.0" font-weight="600" fill="#24292f">search_media</text>
<text x="1225" y="144.0" text-anchor="middle" font-size="10.0" fill="#57606a" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">query = favourite tag</text>
<rect x="912" y="220" width="190" height="64" rx="6" fill="#f6f8fa" stroke="#57606a" stroke-width="1.5" />
<text x="1007" y="244.0" text-anchor="middle" font-size="12.0" font-weight="600" fill="#24292f">recent highlights</text>
<text x="1007" y="258.0" text-anchor="middle" font-size="10.0" fill="#57606a" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">list_trips → highlights[:4]</text>
<text x="1007" y="270.0" text-anchor="middle" font-size="10.0" fill="#57606a" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">per trip</text>
