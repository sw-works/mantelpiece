<text x="1007" y="384.0" text-anchor="middle" font-size="10.0" fill="#57606a" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">idle slideshow</text>
<rect x="24" y="485" width="18" height="12" rx="3" fill="#f6f8fa" stroke="#57606a" />
<text x="48" y="495" font-size="11" fill="#57606a">deterministic code</text>
<rect x="191.2" y="485" width="18" height="12" rx="3" fill="#ffffff" stroke="#57606a" stroke-dasharray="5 3"/>
<text x="215.2" y="495" font-size="11" fill="#57606a">store / queue</text>
