<text x="1225" y="244.0" text-anchor="middle" font-size="12.0" font-weight="600" fill="#24292f">create_playlist</text>
<text x="1225" y="258.0" text-anchor="middle" font-size="10.0" fill="#57606a" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">"Ambient"</text>
