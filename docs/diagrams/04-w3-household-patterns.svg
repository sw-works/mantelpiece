<text x="1007" y="130.0" text-anchor="middle" font-size="12.0" font-weight="600" fill="#24292f">favourite tag?</text>
<text x="1007" y="144.0" text-anchor="middle" font-size="10.0" fill="#57606a" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">argmax over weights</text>
