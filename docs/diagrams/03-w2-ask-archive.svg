<text x="135" y="138.0" text-anchor="middle" font-size="10.0" fill="#57606a" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">TV Ask screen or Alexa+</text>
<text x="135" y="150.0" text-anchor="middle" font-size="10.0" fill="#57606a" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">optional trip scope</text>
<rect x="258" y="100" width="190" height="64" rx="6" fill="#eef2ff" stroke="#4c5fd5" stroke-width="1.5" />
<text x="353" y="124.0" text-anchor="middle" font-size="12.0" font-weight="600" fill="#24292f">model.complete</text>
<text x="353" y="138.0" text-anchor="middle" font-size="10.0" fill="#57606a" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">INTENT_SYSTEM: one line of</text>
<text x="353" y="150.0" text-anchor="middle" font-size="10.0" fill="#57606a" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">lowercase keywords</text>
<rect x="476" y="100" width="190" height="64" rx="6" fill="#f6f8fa" stroke="#57606a" stroke-width="1.5" />
<text x="571" y="124.0" text-anchor="middle" font-size="12.0" font-weight="600" fill="#24292f">search_media</text>
<text x="571" y="138.0" text-anchor="middle" font-size="10.0" fill="#57606a" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">scene · trip · date · people</text>
<text x="571" y="150.0" text-anchor="middle" font-size="10.0" fill="#57606a" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">per-trip cache first</text>
<rect x="476" y="220" width="190" height="64" rx="32" fill="#fff0f0" stroke="#cf222e" stroke-width="1.5" />
<text x="571" y="250.0" text-anchor="middle" font-size="12.0" font-weight="600" fill="#24292f">nothing found</text>
<text x="571" y="264.0" text-anchor="middle" font-size="10.0" fill="#57606a" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">count 0, no playlist</text>
<rect x="694" y="100" width="190" height="64" rx="6" fill="#f6f8fa" stroke="#57606a" stroke-width="1.5" />
<text x="789" y="124.0" text-anchor="middle" font-size="12.0" font-weight="600" fill="#24292f">create_playlist</text>
<text x="789" y="138.0" text-anchor="middle" font-size="10.0" fill="#57606a" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">name = prompt[:60]</text>
<text x="789" y="150.0" text-anchor="middle" font-size="10.0" fill="#57606a" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">source = ask:&lt;query&gt;</text>
