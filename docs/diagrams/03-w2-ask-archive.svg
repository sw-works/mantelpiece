<rect x="1130" y="100" width="190" height="64" rx="32" fill="#e6f4ea" stroke="#1a7f37" stroke-width="1.5" />
<text x="1225" y="130.6" text-anchor="middle" font-size="12.0" font-weight="600" fill="#24292f">TV plays it</text>
<text x="1225" y="144.6" text-anchor="middle" font-size="9.0" fill="#57606a" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">Alexa+: voice answer + Echo Show</text>
<rect x="24" y="365" width="18" height="12" rx="3" fill="#f6f8fa" stroke="#57606a" />
<text x="48" y="375" font-size="11" fill="#57606a">deterministic code</text>
<rect x="191.2" y="365" width="18" height="12" rx="3" fill="#eef2ff" stroke="#4c5fd5" />
<text x="215.2" y="375" font-size="11" fill="#57606a">LLM node</text>
<rect x="294.4" y="365" width="18" height="12" rx="3" fill="#ffffff" stroke="#57606a" stroke-dasharray="5 3"/>
<text x="318.4" y="375" font-size="11" fill="#57606a">store / queue</text>
<rect x="429.59999999999997" y="365" width="18" height="12" rx="3" fill="#f3f4f6" stroke="#8c959f" stroke-dasharray="2 3"/>
<text x="453.59999999999997" y="375" font-size="11" fill="#57606a">external system</text>
<rect x="577.5999999999999" y="365" width="18" height="12" rx="3" fill="#fff0f0" stroke="#cf222e" />
<text x="601.5999999999999" y="375" font-size="11" fill="#57606a">blocked / failed</text>
<rect x="731.9999999999999" y="365" width="18" height="12" rx="3" fill="#e6f4ea" stroke="#1a7f37" />
<text x="755.9999999999999" y="375" font-size="11" fill="#57606a">terminal / outcome</text>
<text x="1336" y="350" text-anchor="end" font-size="10.5" fill="#57606a">Why not let the model pick photos: the within-trip answer budget is 300 ms warm (F-303); vector search meets it, a second model call does not.</text>
</svg>