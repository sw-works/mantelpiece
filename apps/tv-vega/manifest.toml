# Vega OS package manifest. Read by `react-native build-vega`; ignored by the Fire OS build.
# Component id must match the "name" in app.json. Only network access is requested: the app
# is fetch-only with no media playback, DRM, or audio surfaces.
schema-version = 1

[package]
title = "MemoryLane"
version = "0.1.0"
id = "com.hanyu.memorylane"

# Required since Vega SDK 0.24: the OS line the package is built for and the oldest it runs on.
[os.version]
target = "1.2"
min = "1.2"

[components]
[[components.interactive]]
id = "com.hanyu.memorylane.main"
runtime-module = "/com.amazon.kepler.runtime.react_native_kepler_4@IReactNativeKepler_0"
launch-type = "singleton"
categories = ["com.amazon.category.main"]

[processes]
[[processes.group]]
component-ids = ["com.hanyu.memorylane.main"]

# Optional capabilities.
[wants]
[[wants.service]]
id = "com.amazon.inputmethod.service" # on-screen keyboard for the Ask prompt

[[wants.service]]
id = "com.amazon.network.service"

# Required capabilities. The module ids follow the React Native 0.83 / react-native-kepler 4
# sample (AmazonAppDev/react-native-multi-tv-helloworld); not yet verified on a device.
[needs]
[[needs.module]]
id = "/com.amazon.vega.os@IVega_1_2"

[[needs.module]]
id = "/com.amazon.kepler.keplerscript_4@IKeplerScript_0"

[[needs.privilege]]
id = "com.amazon.network.privilege.net-info"

[offers]
[[offers.interaction]]
id = "com.hanyu.memorylane.main"
