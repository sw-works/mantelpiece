# Vega OS package manifest. Read by `react-native build-vega`; ignored by the Fire OS build.
# Component id must match the "name" in app.json. Only network access is requested: the app
# is fetch-only with no media playback, DRM, or audio surfaces.
schema-version = 1

[package]
title = "MemoryLane"
version = "0.1.0"
id = "com.hanyu.memorylane"

# Required since Vega SDK 0.24: the OS line the package is built for and the oldest it runs on.
[os.version]
target = "1.2"
min = "1.2"

[components]
[[components.interactive]]
id = "com.hanyu.memorylane.main"
runtime-module = "/com.amazon.kepler.runtime.react_native_kepler_4@IReactNativeKepler_0"
launch-type = "singleton"
categories = ["com.amazon.category.main"]

[processes]
[[processes.group]]
component-ids = ["com.hanyu.memorylane.main"]

# Optional capabilities.
[wants]
[[wants.service]]
id = "com.amazon.inputmethod.service" # on-screen keyboard for the Ask prompt

[[wants.service]]
id = "com.amazon.network.service"

# W3C media playback (live-latency spike, specs/video-call-feasibility-2026-09-15.md).
[[wants.service]]
id = "com.amazon.media.server"

[[wants.service]]
id = "com.amazon.media.playersession.service"

[[wants.service]]
id = "com.amazon.mediabuffer.service"

[[wants.service]]
id = "com.amazon.mediatransform.service"

[[wants.service]]
id = "com.amazon.mediametrics.service"

[[wants.service]]
id = "com.amazon.gipc.uuid.*"

[[wants.service]]
id = "com.amazon.audio.stream"

[[wants.service]]
id = "com.amazon.audio.control"

# Required capabilities. The module ids follow the React Native 0.83 / react-native-kepler 4
# sample (AmazonAppDev/react-native-multi-tv-helloworld); not yet verified on a device.
[needs]
[[needs.module]]
id = "/com.amazon.vega.os@IVega_1_2"

[[needs.module]]
id = "/com.amazon.kepler.keplerscript_4@IKeplerScript_0"

[[needs.privilege]]
id = "com.amazon.network.privilege.net-info"

[[needs.module]]
id = "/com.amazon.kepler.async_storage__async_storage_2@IAsyncStorage__AsyncStorage_1"

# System-deployed W3C media port (@amazon-devices/react-native-w3cmedia 2.3.4-rn-83).
[[needs.module]]
id = "/com.amazon.kepler.w3cmedia_2@IW3cmedia_3"

# Turbo modules the W3C media port pulls in; the packager only records direct dependencies.
[[needs.module]]
id = "/com.amazon.kepler.keplermediadescriptor_1@IKeplermediadescriptor_1"

[[needs.module]]
id = "/com.amazon.kepler.kepler_media_controls_1@IKeplerMediaControls_0"


[offers]
[[offers.interaction]]
id = "com.hanyu.memorylane.main"

[[offers.service]]
id = "com.amazon.gipc.uuid.*"
