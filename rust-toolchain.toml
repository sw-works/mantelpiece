# One Rust for CI, deploys and local builds. Bump it on purpose: clippy adds lints between
# releases and CI lints with -D warnings. The Linux target is for the arm64 Lambdas.
[toolchain]
channel = "1.99.1"
profile = "minimal"
components = ["rustfmt", "clippy"]
targets = ["aarch64-unknown-linux-gnu"]
