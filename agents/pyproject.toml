[project]
name = "mantelpiece-agents"
version = "0.1.0"
description = "Mantelpiece Concierge agent and event-driven workflows for AgentCore Runtime"
requires-python = ">=3.12"
license = "MIT"
dependencies = []

[project.optional-dependencies]
runtime = [
    "bedrock-agentcore>=0.1",
    "strands-agents>=1.0",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mantelpiece_agents", "src/mantelpiece_skill"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
